name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build shared first — server and client depend on it
      - name: Build sockr-shared
        run: pnpm --filter sockr-shared build

      - name: Build sockr-server and sockr-client
        run: pnpm --filter sockr-server --filter sockr-client build

      # Publish shared first so server/client can resolve it on npm
      - name: Publish sockr-shared
        run: pnpm --filter sockr-shared publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish sockr-server
        run: pnpm --filter sockr-server publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish sockr-client
        run: pnpm --filter sockr-client publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
