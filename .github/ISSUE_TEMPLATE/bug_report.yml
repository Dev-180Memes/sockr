name: Bug Report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please search open issues to avoid duplicates.

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - sockr-server
        - sockr-client
        - sockr-shared
        - Multiple packages
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. sockr-server@1.2.0
      placeholder: "sockr-server@1.2.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the bug.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, framework (React / React Native / vanilla), OS.
      placeholder: |
        Node: 20.x
        Framework: React 19 / React Native 0.74
        OS: macOS 14
    validations:
      required: true
