# ─── Coturn reference configuration for Sockr ────────────────────────────────
# Annotated with the settings most likely to need changing.
# Full reference: https://github.com/coturn/coturn/blob/master/README.turnserver

# The public IP of your TURN server.
# Replace with your actual server IP or domain.
# external-ip=YOUR_PUBLIC_IP

# Listening ports
listening-port=3478
tls-listening-port=5349

# Relay port range — must be open in your firewall/security group
min-port=49152
max-port=65535

# ─── Authentication ───────────────────────────────────────────────────────────
# Sockr uses the HMAC-SHA1 time-limited credential mechanism.
# This secret must match the `turn.secret` value in your SocketServer config.
# Generate a strong secret: openssl rand -hex 32
use-auth-secret
static-auth-secret=${TURN_SECRET}

# Credential lifetime (seconds). Match this to VoiceConfig.turn.ttl (default 3600).
credential-ttl=3600

# ─── Realm ────────────────────────────────────────────────────────────────────
# Set this to your domain. Required.
realm=example.com

# ─── Security ────────────────────────────────────────────────────────────────
# Only allow relay traffic — no proxying to internal network addresses.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255

# ─── TLS (recommended in production) ─────────────────────────────────────────
# Uncomment and point to your cert files for TURNS (TLS) support.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# ─── Logging ─────────────────────────────────────────────────────────────────
log-file=stdout
verbose
